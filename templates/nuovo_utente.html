{% extends "base.html" %}
{% block title %}Nuovo utente - POS IoT{% endblock %}

{% block content %}
<h1>Registra nuovo utente</h1>

<div class="card">
    {% if errore %}
        <div class="alert error">{{ errore }}</div>
    {% endif %}
    <form method="POST">
        <label>
            UID della carta NFC
            <input type="text" name="uid" required placeholder="es. 584195345601">
        </label>
        <label>
            Nome e cognome
            <input type="text" name="nome" required>
        </label>
        <label>
            PIN (4 cifre)
            <input type="text" name="pin" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric">
        </label>
        <label>
            Saldo iniziale (EUR)
            <input type="number" name="saldo" required step="0.01" min="0" value="0">
        </label>
        <div class="form-actions">
            <a href="{{ url_for('utenti') }}" class="btn">Annulla</a>
            <button type="submit" class="btn primary">Registra</button>
        </div>
    </form>
</div>
{% endblock %}
