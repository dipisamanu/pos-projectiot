{% extends "base.html" %}
{% block title %}Accesso - POS IoT{% endblock %}

{% block content %}
<div class="card login-card">
    <h1>Accesso esercente</h1>
    {% if errore %}
        <div class="alert error">{{ errore }}</div>
    {% endif %}
    <form method="POST">
        <label>
            Username
            <input type="text" name="username" required autofocus autocomplete="username">
        </label>
        <label>
            Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary big">Accedi</button>
    </form>
    <p class="hint">Account di test: admin / admin123</p>
</div>
{% endblock %}
